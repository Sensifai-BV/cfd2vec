# Masked field modelling of CFD2vec-S on the AERO urban pool. Recommended: run `cfd2vec device-check` first and choose
# the batch size with the best samples/s that leaves memory headroom; keep max_steps fixed across a resumed run
# (cosine schedule). Each epoch is one seeded permutation of the whole training pool, so 24,000 steps x batch 2 =
# 48 k samples is about 36 passes over the 1,326 training cases; run.json records the realised epoch length and
# coverage.json the distinct cases drawn.
# Measured with grad_checkpoint off: batch 2 = 1.31 s/step, 16 GB accelerator memory; batch 4 does not fit.
model: configs/model_S_urban.yaml
shards: ${CFD2VEC_DATA}/cfd2vec_shards_v2   # v2 = v1 point sets + Re from each case's params.json; CFD2VEC_DATA defaults to ~/External/Datasets/cfd
channel_stats: configs/channel_stats.json
sources: [aero_urban]          # one manifest_<source>.parquet per source under `shards`, or list them in `manifests`
heldout_sources: [windsorml, hiliftaeroml]   # never admitted to the pretraining pool
# source_weights: {aero_urban: 1.0}          # optional per-source share of each epoch; default is proportional
mask:
  ratios: [0.6, 0.9, 1.0]
  probs: [0.5, 0.25, 0.25]
  modes: [tokens, near_wall, wake, boxes]
  mode_probs: [0.4, 0.2, 0.2, 0.2]
prior_prob: 0.5
optim:
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_steps: 2000
  grad_clip_norm: 1.0
precision: fp32
memory_fraction: 0.9        # accelerator memory cap; exceeding it raises an error instead of swapping
batch_size: 2
max_steps: 24000
max_minutes: 1.0e+9
log_every: 25
eval_every: 2000
eval_cases: 12
val_recon_cases: 0
num_workers: 4
seed: 0
