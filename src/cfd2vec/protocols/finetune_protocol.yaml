# CFD2vec fine-tuning protocol. Version 2, frozen 2026-09-28 (version 1 superseded the same day, before any
# pre-registered experiment was run).
# Recommended: apply it unchanged to every method (CFD2vec, from-scratch, supervised-pretrained, baselines)
# and every budget N, so that data-efficiency comparisons stay fair. If a value must change, bump `version`
# and record the reason in the monthly report.
version: 2
changelog:
  - "v2: small_n_threshold 10 -> 30. A 20 % carve-out of N = 10 is two cases; in the urban pilot the supervised
     model improved on those two and degraded on test. Below N = 30 a fixed schedule is used instead."
  - "v2: the starting weights are scored as epoch 0, so early stopping never returns a worse model than it started from."
frozen: "2026-09-28"
task: "geometry + inflow -> field (100 % masked mode); coarse-twin input NOT used"
optimizer:
  name: AdamW
  lr_encoder: 1.0e-4        # tokeniser + backbone (+ conditioning embeddings)
  lr_decoder: 3.0e-4        # implicit field decoder + output head
  weight_decay: 0.05
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
schedule:
  name: cosine
  warmup_epochs: 0
  min_lr_ratio: 0.0
epochs:
  max: 200
  small_n_threshold: 30     # N < 30 -> fixed schedule, no validation carve-out
  fixed_epochs_small_n: 30
early_stopping:
  val_fraction: 0.2         # carved out of the N fine-tuning cases (N >= small_n_threshold), seeded
  patience_epochs: 20
  monitor: val_rel_l2_mean  # mean of rel-L2(U), rel-L2(Cp), rel-L2(k)
mask_ratio: 1.0             # every downstream use is the 100 %-masked mode
augmentation:
  so2_rotation_about_z: true   # applied only where Case.cond.rotation_ok is true (exact only for uniform-direction inflow)
  spanwise_mirror: true
seeds:
  default: [0, 1, 2]
  n10: [0, 1, 2, 3, 4]
budgets_N: [10, 30, 100, 300]
metrics: [rel_l2_U, rel_l2_Cp, rel_l2_k]
